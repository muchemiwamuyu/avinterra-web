server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. These live here rather than in next.config.ts because a
    # static export has no server to run headers() — nginx is what serves the site.
    #
    # nginx gotcha: add_header is inherited by a location block ONLY if that block
    # declares no add_header of its own. The asset locations below set their own
    # Cache-Control, so they must re-declare any header they still need.
    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header X-Frame-Options         "DENY"                           always;
    add_header X-XSS-Protection        "1; mode=block"                  always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # Next.js hashed chunks — cache forever
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Other static assets
    location ~* \.(css|js|woff2?|ttf|svg|ico|png|jpg|jpeg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
